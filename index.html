<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MGS Email Studio — Palette System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ui-bg:#f4f5f7;
  --ui-panel:#fff;
  --ui-line:#e4e7ec;
  --ui-text:#20242c;
  --ui-muted:#697386;
  --ui-soft:#f8f9fb;
  --ui-accent:#7357ff;
  --ui-accent-soft:#f0edff;
  --ui-blue:#4478ff;
  --shadow:0 8px 28px rgba(30,37,50,.08);

  /* Exact Madibaev Graphic Studio tokens */
  --mgs-bg:#0b0b0c;
  --mgs-surface:#111113;
  --mgs-raised:#171719;
  --mgs-text:#f5f2ea;
  --mgs-muted:#aaa7a0;
  --mgs-dim:#76736e;
  --mgs-blue:#00a0e3;
  --mgs-pink:#e5097f;
  --mgs-yellow:#ffed00;
  --mgs-green:#7fe0a1;
  --mgs-hero-blue:#73d7ff;
  --mgs-hero-purple:#a985ee;
  --mgs-hero-pink:#ed75bd;
  --mgs-hero-yellow:#ffda69;
  --mgs-heading:'Unbounded',Arial,Helvetica,sans-serif;
  --mgs-body:'Fira Sans',Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ui-text);background:var(--ui-bg);font-size:14px}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
.app{height:100vh;display:grid;grid-template-rows:58px 1fr;overflow:hidden}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:58px;background:#fff;border-bottom:1px solid var(--ui-line);padding:0 14px;z-index:50}
.top-left,.top-center,.top-right{display:flex;align-items:center;gap:8px;min-width:0}
.top-center{justify-content:center}
.top-right{justify-content:flex-end}
.icon-btn{width:34px;height:34px;border:1px solid transparent;background:transparent;border-radius:8px;color:#566174;display:grid;place-items:center}
.icon-btn:hover{background:var(--ui-soft);border-color:var(--ui-line)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor}
.design-name{border:0;background:transparent;font-weight:650;color:#303642;min-width:120px;max-width:260px;padding:8px 6px;border-radius:7px}
.design-name:hover,.design-name:focus{background:var(--ui-soft);outline:none}
.saved{display:flex;align-items:center;gap:6px;color:#7c8799;font-size:12px;white-space:nowrap}
.saved-dot{width:7px;height:7px;border-radius:50%;background:#46b878}
.device-toggle{display:flex;background:#f4f5f7;border:1px solid var(--ui-line);padding:3px;border-radius:8px}
.device-toggle button{border:0;background:transparent;width:32px;height:28px;border-radius:6px;display:grid;place-items:center;color:#8792a5}
.device-toggle button.active{background:#fff;color:#343b49;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.device-toggle svg{width:16px;height:16px;stroke:currentColor}
.top-btn{border:1px solid var(--ui-line);background:#fff;color:#3c4453;border-radius:8px;padding:8px 12px;font-weight:600;font-size:12px}
.top-btn:hover{background:var(--ui-soft)}
.top-btn.primary{border-color:var(--ui-accent);background:var(--ui-accent);color:#fff}
.main{min-height:0;display:grid;grid-template-columns:1fr 355px}
.stage{min-width:0;overflow:auto;background:#eef0f3;position:relative}
.stage-inner{min-height:100%;padding:42px 44px 80px;display:flex;justify-content:center;align-items:flex-start}
.stage-canvas{transition:.22s width;width:660px;min-height:540px}
.stage-canvas.mobile{width:375px}
.email-shell{width:100%;box-shadow:0 4px 18px rgba(38,45,57,.12);position:relative}
.row-wrap{position:relative;border:1px solid transparent}
.row-wrap:hover{border-color:#a8b3c6}
.row-wrap.selected{border-color:var(--ui-accent)}
.row-toolbar{position:absolute;left:-39px;top:8px;display:none;flex-direction:column;background:#fff;border:1px solid #dfe3e9;border-radius:8px;box-shadow:0 3px 12px rgba(0,0,0,.08);overflow:hidden;z-index:8}
.row-wrap:hover>.row-toolbar,.row-wrap.selected>.row-toolbar{display:flex}
.row-toolbar button{width:34px;height:31px;border:0;background:#fff;color:#647084;font-size:13px}
.row-toolbar button:hover{background:#f5f6f8;color:#2f3540}
.row-columns{display:table;width:100%;table-layout:fixed}
.row-column{display:table-cell;vertical-align:top;position:relative;min-height:30px}
.row-column.dragover{outline:2px dashed var(--ui-accent);outline-offset:-5px;background:rgba(115,87,255,.04)!important}
.empty-column{margin:8px;border:1px dashed #b8c0cd;border-radius:5px;padding:18px 10px;text-align:center;color:#8792a5;font-size:12px;background:rgba(255,255,255,.35)}
.content-block{position:relative;border:1px solid transparent}
.content-block:hover{border-color:#8fa6d7}
.content-block.selected{border-color:#477cff}
.content-toolbar{position:absolute;top:-35px;right:0;display:none;align-items:center;background:#477cff;color:#fff;border-radius:6px 6px 0 0;overflow:hidden;z-index:12}
.content-block:hover>.content-toolbar,.content-block.selected>.content-toolbar{display:flex}
.content-toolbar button{height:34px;min-width:34px;border:0;background:#477cff;color:#fff;font-size:13px}
.content-toolbar button:hover{background:#3569e4}
.content-toolbar .drag{cursor:grab}
.block-inner{min-height:16px}
.sidebar{min-width:0;border-left:1px solid var(--ui-line);background:#fff;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.tabs{height:52px;display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--ui-line)}
.tabs button{border:0;background:#fff;color:#737f92;font-size:11px;font-weight:700;letter-spacing:.02em}
.tabs button.active{color:#313846;border-bottom:2px solid var(--ui-accent)}
.panel{overflow:auto;padding:18px}
.panel-title{display:flex;align-items:center;justify-content:space-between;margin:-18px -18px 18px;padding:14px 15px;border-bottom:1px solid var(--ui-line);background:#fff;position:sticky;top:0;z-index:4}
.panel-title h3{margin:0;font-size:13px}
.back-btn{border:0;background:transparent;color:#6e798b;width:28px;height:28px;border-radius:6px}
.back-btn:hover{background:#f2f4f7}
.section-label{margin:4px 0 12px;font-size:10px;font-weight:750;letter-spacing:.08em;color:#8a95a7;text-transform:uppercase}
.block-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lib-block{height:86px;border:1px solid var(--ui-line);background:#fff;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;color:#4e586a;user-select:none}
.lib-block:hover{border-color:#b8aaff;background:#faf9ff;color:#5c43dc}
.lib-block:active{cursor:grabbing}
.lib-block svg{width:23px;height:23px;stroke:currentColor}
.lib-block span{font-size:11px;font-weight:600}
.row-presets{display:grid;gap:11px}
.row-preset{height:64px;border:1px solid var(--ui-line);border-radius:8px;background:#fff;padding:9px;display:flex;gap:6px}
.row-preset:hover{border-color:#b8aaff;background:#faf9ff}
.row-preset i{display:block;background:#e9edf2;border:1px solid #d5dbe4;border-radius:3px;flex:1}
.field{margin-bottom:17px}
.field label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:600;color:#4f596a;margin-bottom:7px}
.field small{font-weight:400;color:#8b96a8}
.input,.field input[type=text],.field input[type=url],.field input[type=number],.field textarea,.field select{width:100%;border:1px solid #dce1e8;background:#fff;border-radius:7px;padding:9px 10px;color:#2e3541;outline:none}
.field textarea{resize:vertical;min-height:88px;line-height:1.45}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#9c8bff;box-shadow:0 0 0 2px rgba(115,87,255,.09)}
.field input[type=color]{width:42px;height:34px;border:1px solid #dce1e8;border-radius:7px;padding:3px;background:#fff}
.inline-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.align-buttons{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #dce1e8;border-radius:7px;overflow:hidden}
.align-buttons button{height:34px;border:0;border-right:1px solid #dce1e8;background:#fff;color:#718095}
.align-buttons button:last-child{border-right:0}
.align-buttons button.active{background:#f0edff;color:#5b43dc}
.property-group{border-top:1px solid var(--ui-line);padding-top:17px;margin-top:17px}
.switch-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#4f596a}
.switch{width:37px;height:21px;border:0;border-radius:999px;background:#d9dee6;padding:2px;transition:.18s}
.switch:after{content:"";display:block;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.16);transition:.18s}
.switch.on{background:var(--ui-accent)}
.switch.on:after{transform:translateX(16px)}
.notice{font-size:11px;line-height:1.5;color:#7c8798;background:#f8f9fb;border:1px solid #e3e7ed;padding:11px;border-radius:8px}
.upload{display:block;border:1px dashed #cbd2dc;background:#fafbfc;border-radius:8px;padding:12px;text-align:center;font-size:11px;color:#6e798a}
.upload input{display:none}
.settings-card{border:1px solid var(--ui-line);border-radius:9px;padding:14px;background:#fff;margin-bottom:12px}
.settings-card h4{margin:0 0 12px;font-size:12px}
.export-menu{position:fixed;right:12px;top:52px;width:220px;background:#fff;border:1px solid var(--ui-line);border-radius:9px;box-shadow:var(--shadow);z-index:100;padding:6px;display:none}
.export-menu.show{display:block}
.export-menu button{width:100%;text-align:left;border:0;background:#fff;border-radius:6px;padding:10px 11px;font-size:12px;color:#3e4654}
.export-menu button:hover{background:#f5f6f8}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);background:#242a34;color:#fff;border-radius:8px;padding:10px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:120}
.toast.show{opacity:1;transform:translate(-50%,0)}

.mode-toggle{display:flex;background:#f4f5f7;border:1px solid var(--ui-line);padding:3px;border-radius:8px;margin-left:2px}
.mode-toggle button{border:0;background:transparent;height:28px;padding:0 10px;border-radius:6px;color:#8792a5;font-size:10px;font-weight:750;letter-spacing:.03em}
.mode-toggle button.active{background:#fff;color:#343b49;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.palette-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.palette-chip{display:flex;align-items:center;gap:9px;border:1px solid var(--ui-line);border-radius:8px;padding:8px;background:#fff;min-width:0;text-align:left;transition:.15s transform,.15s border-color,.15s box-shadow}
.palette-chip:hover{border-color:#a99cff;box-shadow:0 3px 10px rgba(78,62,180,.08);transform:translateY(-1px)}
.palette-chip i{width:24px;height:24px;flex:0 0 24px;border-radius:6px;border:1px solid rgba(0,0,0,.08)}
.palette-chip span{min-width:0;font-size:10px;color:#6b7688;line-height:1.25}
.palette-chip b{display:block;color:#38404d;font-size:10px;font-weight:700}
.palette-section{margin:0 0 14px}
.palette-section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 7px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#929cad}
.quick-palette{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid #e1e5eb;border-radius:8px;background:#f8f9fb;margin:-7px 0 16px}
.quick-palette button{position:relative;width:27px;height:27px;padding:0;border:1px solid rgba(0,0,0,.12);border-radius:7px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:.14s transform,.14s box-shadow}
.quick-palette button:hover{transform:scale(1.08);box-shadow:0 3px 8px rgba(0,0,0,.14)}
.quick-palette button:after{content:"";position:absolute;inset:3px;border:1px solid rgba(255,255,255,.25);border-radius:4px}
.quick-palette .gradient-dot{background:linear-gradient(135deg,#73d7ff,#a985ee 34%,#ed75bd 68%,#ffda69)!important}
.palette-target{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:11px}
.palette-target button{border:1px solid #dce1e8;background:#fff;border-radius:7px;padding:8px 9px;font-size:10px;font-weight:700;color:#6d788a}
.palette-target button.active{border-color:#9f8cff;background:#f1efff;color:#5b43dc}
.palette-full-title{font-size:10px;font-weight:700;color:#596476;margin:14px 0 8px}
.palette-tip{font-size:10px;line-height:1.45;color:#8a95a7;margin-top:8px}
.color-control{display:grid;grid-template-columns:42px 1fr;gap:7px;align-items:center}
.color-control input[type=color]{width:42px;height:36px}
.color-control input[type=text]{width:100%;height:36px;text-transform:uppercase;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
.typography-preview{border:1px solid var(--ui-line);border-radius:9px;background:#0b0b0c;padding:15px;margin-bottom:13px}
.typography-preview .h{font-family:var(--mgs-heading);font-size:18px;font-weight:600;line-height:1.15;color:#f5f2ea}
.typography-preview .p{margin-top:8px;font-family:var(--mgs-body);font-size:12px;line-height:1.5;color:#aaa7a0}
.gradient-swatch{height:34px;border-radius:7px;border:1px solid #dce1e8;background:linear-gradient(100deg,#73d7ff 0%,#a985ee 32%,#ed75bd 61%,#ffda69 100%)}
.email-shell[data-mode="brand"] .mgs-preview-heading{font-family:var(--mgs-heading)!important;font-weight:600!important}
.email-shell[data-mode="brand"] .mgs-preview-body{font-family:var(--mgs-body)!important}
.email-shell[data-mode="safe"] .mgs-preview-heading,
.email-shell[data-mode="safe"] .mgs-preview-body{font-family:Arial,Helvetica,sans-serif!important}

.mobile-warning{display:none}
@media(max-width:900px){
  .app{height:auto;min-height:100vh;overflow:auto}
  .topbar{grid-template-columns:1fr auto}
  .top-center{display:none}
  .main{grid-template-columns:1fr}
  .stage{min-height:620px}
  .sidebar{border-left:0;border-top:1px solid var(--ui-line);height:720px}
  .stage-inner{padding:26px 18px}
  .stage-canvas{width:min(660px,100%)}
  .top-left .design-name{max-width:160px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="top-left">
      <button class="icon-btn" title="Назад" onclick="toast('Проект сохраняется автоматически')">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <input id="designName" class="design-name" value="MGS — New email">
      <span class="saved"><i class="saved-dot"></i><span id="saveStatus">Saved</span></span>
    </div>

    <div class="top-center">
      <button id="undoBtn" class="icon-btn" title="Undo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 7L5 11l4 4M5 11h8a6 6 0 010 12" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="redoBtn" class="icon-btn" title="Redo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 7l4 4-4 4m4-4h-8a6 6 0 000 12" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="device-toggle">
        <button id="desktopBtn" class="active" title="Desktop">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21h8M12 17v4" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button id="mobileBtn" title="Mobile">
          <svg viewBox="0 0 24 24" fill="none"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M10.5 18.5h3" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="mode-toggle" title="Brand Accurate uses MGS fonts/gradient. Gmail Safe shows the safer fallback.">
        <button id="brandModeBtn" class="active">BRAND</button>
        <button id="safeModeBtn">GMAIL SAFE</button>
      </div>
    </div>

    <div class="top-right">
      <button class="top-btn" id="previewBtn">Preview</button>
      <button class="top-btn primary" id="exportBtn">Export ▾</button>
    </div>
  </header>

  <div class="main">
    <section class="stage" id="stage">
      <div class="stage-inner">
        <div class="stage-canvas" id="stageCanvas">
          <div class="email-shell" id="emailCanvas"></div>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <nav class="tabs" id="tabs">
        <button data-tab="content" class="active">CONTENT</button>
        <button data-tab="rows">ROWS</button>
        <button data-tab="settings">SETTINGS</button>
      </nav>
      <div class="panel" id="panel"></div>
    </aside>
  </div>
</div>

<div class="export-menu" id="exportMenu">
  <button id="copyGmail">Copy for Gmail</button>
  <button id="downloadHtml">Download HTML</button>
  <button id="copyCode">Copy HTML code</button>
  <button id="exportJson">Export project JSON</button>
  <button id="importJsonBtn">Import project JSON</button>
  <input id="importJson" type="file" accept=".json,application/json" hidden>
</div>
<div class="toast" id="toast"></div>

<script>
const ICONS={
 title:`<svg viewBox="0 0 24 24" fill="none"><path d="M5 5h14M12 5v14M8 19h8" stroke-width="1.7" stroke-linecap="round"/></svg>`,

 divider:`<svg viewBox="0 0 24 24" fill="none"><path d="M3 12h18" stroke-width="1.8" stroke-linecap="round"/></svg>`,

const defaults={

       {id:uid(),type:"paragraph",text:"Стратегия, дизайн и технологии в одной команде. Разбираемся в задаче, проектируем решение и доводим его до запуска.",color:"#aaa7a0",size:17,align:"left",padding:10},
       {id:uid(),type:"button",text:"Обсудить проект ↗",url:"mailto:alexandr@madibaev.online?subject=Обсудить%20проект",bg:"#f5f2ea",color:"#0b0b0c",align:"left",radius:999,padding:12}

   {id:uid(),bg:"#111113",contentBg:"#111113",padding:34,stack:true,columns:[

let state=load()||deep(defaults);
let selected={type:null,rowId:null,colIndex:null,blockId:null};
let activeTab="content";
let history=[JSON.stringify(state)], historyIndex=0, saveTimer;

function uid(){return "id_"+Math.random().toString(36).slice(2,10)}
function deep(o){return JSON.parse(JSON.stringify(o))}
function load(){try{return JSON.parse(localStorage.getItem("mgs-rge-editor-v4"))}catch(e){return null}}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function attr(s=""){return esc(s)}
function nl2br(s=""){return esc(s).replace(/\n/g,"<br>")}

function scheduleSave(){
  document.getElementById("saveStatus").textContent="Saving…";
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    localStorage.setItem("mgs-rge-editor-v4",JSON.stringify(state));
    document.getElementById("saveStatus").textContent="Saved";
  },350);
}
function snapshot(){
  const s=JSON.stringify(state);
  if(history[historyIndex]===s)return;
  history=history.slice(0,historyIndex+1);
  history.push(s); historyIndex++;
  if(history.length>60){history.shift();historyIndex--}
  updateUndo();
}
function mutate(fn,withHistory=true){
  fn();
  if(withHistory)snapshot();
  scheduleSave();
  renderCanvas();
  renderPanel();
}
function updateUndo(){
  document.getElementById("undoBtn").disabled=historyIndex<=0;
  document.getElementById("redoBtn").disabled=historyIndex>=history.length-1;
}
function undo(){
  if(historyIndex<=0)return;
  historyIndex--;state=JSON.parse(history[historyIndex]);selected={type:null,rowId:null,colIndex:null,blockId:null};scheduleSave();renderAll();
}
function redo(){
  if(historyIndex>=history.length-1)return;
  historyIndex++;state=JSON.parse(history[historyIndex]);selected={type:null,rowId:null,colIndex:null,blockId:null};scheduleSave();renderAll();
}
function getRow(id){return state.rows.find(r=>r.id===id)}
function getBlock(sel=selected){
  const row=getRow(sel.rowId); if(!row)return null;
  return row.columns[sel.colIndex]?.blocks.find(b=>b.id===sel.blockId)||null;
}
function locateBlock(id){
  for(const row of state.rows)for(let ci=0;ci<row.columns.length;ci++){
    const bi=row.columns[ci].blocks.findIndex(b=>b.id===id);
    if(bi>=0)return {rowId:row.id,colIndex:ci,blockIndex:bi};
  }
  return null;
}
function defaultBlock(type){
  const map={
    title:{type:"title",text:"Новый заголовок",accent:"",accentMode:"solid",accentColor:"#00a0e3",color:"#f5f2ea",size:34,align:"left",padding:10},
    paragraph:{type:"paragraph",text:"Добавьте текст вашего сообщения.",color:"#aaa7a0",size:16,align:"left",padding:10},
    image:{type:"image",url:"",alt:"Изображение",link:"",width:100,radius:16,align:"center",padding:10},
    button:{type:"button",text:"Подробнее ↗",url:"https://www.madibaevstudio.online/",bg:"#f5f2ea",color:"#0b0b0c",align:"left",radius:999,padding:10},
    divider:{type:"divider",color:"#343236",thickness:1,padding:12},
    spacer:{type:"spacer",height:28},
    logo:{type:"logo",url:"https://www.madibaevstudio.online/mgs-logo.svg",link:"https://www.madibaevstudio.online/",width:112,align:"left",padding:8},
    eyebrow:{type:"eyebrow",text:"SECTION LABEL",color:"#76736e",size:10,align:"left",padding:4}
  };
  return Object.assign({id:uid()},deep(map[type]));
}
function addContent(type,rowId=null,colIndex=0){
  let row=rowId?getRow(rowId):state.rows[state.rows.length-1];
  if(!row){
    row={id:uid(),bg:state.settings.contentBg,contentBg:state.settings.contentBg,padding:24,stack:true,columns:[{width:100,blocks:[]}]};
    state.rows.push(row);colIndex=0;
  }
  const b=defaultBlock(type);
  row.columns[colIndex].blocks.push(b);
  selected={type:"block",rowId:row.id,colIndex,blockId:b.id};
  snapshot();scheduleSave();renderAll();
}
function addRow(cols){
  const widths=cols===1?[100]:cols===2?[50,50]:[33.33,33.34,33.33];
  const row={id:uid(),bg:state.settings.bodyBg,contentBg:state.settings.contentBg,padding:18,stack:true,columns:widths.map(w=>({width:w,blocks:[]}))};
  state.rows.push(row);
  selected={type:"row",rowId:row.id,colIndex:null,blockId:null};
  snapshot();scheduleSave();renderAll();
}

const MGS_PALETTE=[
  ["Background","#0b0b0c"],["Surface","#111113"],["Raised","#171719"],["Text","#f5f2ea"],
  ["Muted","#aaa7a0"],["Dim","#76736e"],["Blue","#00a0e3"],["Pink","#e5097f"],
  ["Yellow","#ffed00"],["Green","#7fe0a1"]
];
const MGS_HERO_PALETTE=[
  ["Sky","#73d7ff"],["Purple","#a985ee"],["Rose","#ed75bd"],["Gold","#ffda69"]
];
const MGS_ALL_COLORS=[...MGS_PALETTE,...MGS_HERO_PALETTE];

function isBrandMode(){return state.settings.renderMode!=="safe"}
function previewHeadingFont(){return isBrandMode() ? "'Unbounded', Arial, Helvetica, sans-serif" : "Arial, Helvetica, sans-serif"}
function previewBodyFont(){return isBrandMode() ? "'Fira Sans', Arial, Helvetica, sans-serif" : "Arial, Helvetica, sans-serif"}
function emailHeadingFont(){return isBrandMode() ? "'Unbounded', Arial, Helvetica, sans-serif" : "Arial, Helvetica, sans-serif"}
function emailBodyFont(){return isBrandMode() ? "'Fira Sans', Arial, Helvetica, sans-serif" : "Arial, Helvetica, sans-serif"}
function accentHtml(text,b){
  if((b.accentMode||"solid")==="gradient" && isBrandMode()){
    return `<span style="display:inline-block;color:#73d7ff;background:linear-gradient(100deg,#73d7ff 0%,#a985ee 32%,#ed75bd 61%,#ffda69 100%);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;">${text}</span>`;
  }
  return `<span style="color:${attr(b.accentColor||"#00a0e3")};">${text}</span>`;
}
function paletteMarkup(){
  const section=(title,items)=>`<div class="palette-section">
    <div class="palette-section-title"><span>${title}</span><span>${items.length} colors</span></div>
    <div class="palette-grid">${items.map(([name,color])=>`<button type="button" class="palette-chip" data-copycolor="${color}" title="${name} · ${color}"><i style="background:${color}"></i><span><b>${name}</b>${color.toUpperCase()}</span></button>`).join("")}</div>
  </div>`;
  return section("Core palette",MGS_PALETTE)+section("Hero palette",MGS_HERO_PALETTE);
}
function quickPalette(targetId,{hero=true,gradient=false}={}){
  const core=MGS_PALETTE.map(([name,color])=>`<button type="button" data-palette-target="${targetId}" data-color="${color}" style="background:${color}" title="${name} · ${color}"></button>`).join("");
  const heroColors=hero?MGS_HERO_PALETTE.map(([name,color])=>`<button type="button" data-palette-target="${targetId}" data-color="${color}" style="background:${color}" title="${name} · ${color}"></button>`).join(""):"";
  const grad=gradient?`<button type="button" class="gradient-dot" data-gradient-target="${targetId}" title="MGS Hero Gradient"></button>`:"";
  return `<div class="quick-palette">${core}${heroColors}${grad}</div>`;
}
function bindPaletteCopy(root=document){
  root.querySelectorAll("[data-copycolor]").forEach(btn=>btn.onclick=async()=>{
    try{await navigator.clipboard.writeText(btn.dataset.copycolor);toast(btn.dataset.copycolor.toUpperCase()+" copied")}catch(e){}
  });
}
function bindPaletteApply(root=document){
  root.querySelectorAll("[data-palette-target]").forEach(btn=>btn.onclick=()=>{
    const target=root.querySelector("#"+btn.dataset.paletteTarget) || document.getElementById(btn.dataset.paletteTarget);
    if(!target)return;
    target.value=btn.dataset.color;
    target.dispatchEvent(new Event("input",{bubbles:true}));
    target.dispatchEvent(new Event("change",{bubbles:true}));
    toast(btn.dataset.color.toUpperCase()+" applied");
  });
}
function normalizeHex(v,fallback="#000000"){
  const x=String(v||"").trim();
  if(/^#[0-9a-fA-F]{6}$/.test(x))return x.toLowerCase();
  if(/^#[0-9a-fA-F]{3}$/.test(x))return "#"+x.slice(1).split("").map(c=>c+c).join("").toLowerCase();
  return fallback;
}

function blockPreview(b){
  const base=`padding:${b.padding||0}px;`;
  const hfont=previewHeadingFont(), bfont=previewBodyFont();
  if(b.type==="title"){
    let txt=esc(b.text);
    if(b.accent){
      const target=esc(b.accent);
      txt=txt.replace(target,accentHtml(target,b));
    }
    return `<div class="block-inner mgs-preview-heading" style="${base}font-family:${hfont};font-weight:${isBrandMode()?600:700};font-size:${b.size}px;line-height:1.08;letter-spacing:${isBrandMode()?"-.018em":"-.025em"};color:${b.color};text-align:${b.align};">${txt}</div>`;
  }
  if(b.type==="paragraph")return `<div class="block-inner mgs-preview-body" style="${base}font-family:${bfont};font-size:${b.size}px;font-weight:400;letter-spacing:0;line-height:1.56;color:${b.color};text-align:${b.align};">${nl2br(b.text)}</div>`;
  if(b.type==="eyebrow")return `<div class="block-inner mgs-preview-body" style="${base}font-family:${bfont};font-size:${b.size}px;line-height:1.4;color:${b.color};font-weight:600;letter-spacing:.085em;text-transform:uppercase;text-align:${b.align};">${esc(b.text)}</div>`;
  if(b.type==="image"){
    return `<div class="block-inner" style="${base}text-align:${b.align};">${b.url?`<img src="${attr(b.url)}" alt="${attr(b.alt)}" style="display:inline-block;max-width:${b.width}%;width:${b.width}%;height:auto;border-radius:${b.radius}px;">`:`<div class="mgs-preview-body" style="height:140px;border:1px dashed rgba(245,242,234,.25);border-radius:10px;display:grid;place-items:center;color:#8e8b87;font-family:${bfont};font-size:12px;">Drop an image here</div>`}</div>`;
  }
  if(b.type==="logo")return `<div class="block-inner" style="${base}text-align:${b.align};">${b.url?`<img src="${attr(b.url)}" alt="Logo" style="display:inline-block;width:${b.width}px;max-width:100%;height:auto;">`:""}</div>`;
  if(b.type==="button")return `<div class="block-inner mgs-preview-body" style="${base}text-align:${b.align};"><span style="display:inline-block;padding:14px 21px;border-radius:${b.radius}px;background:${b.bg};color:${b.color};font-family:${bfont};font-size:13px;font-weight:700;">${esc(b.text)}</span></div>`;
  if(b.type==="divider")return `<div class="block-inner" style="padding:${b.padding}px 0;"><div style="height:${b.thickness}px;background:${b.color};"></div></div>`;
  if(b.type==="spacer")return `<div class="block-inner" style="height:${b.height}px;"></div>`;
  return "";
}

function renderCanvas(){
  const root=document.getElementById("emailCanvas");
  root.dataset.mode=isBrandMode()?"brand":"safe";
  root.style.background=state.settings.bodyBg;
  root.innerHTML=state.rows.map((row,ri)=>{
    const selectedRow=selected.type==="row"&&selected.rowId===row.id;
    const cols=row.columns.map((col,ci)=>{
      const blocks=col.blocks.map((b,bi)=>{
        const sel=selected.type==="block"&&selected.blockId===b.id;
        return `<div class="content-block ${sel?"selected":""}" draggable="true" data-block="${b.id}" data-row="${row.id}" data-col="${ci}">
          <div class="content-toolbar">
            <button class="drag" title="Drag">⠿</button>
            <button data-act="up" title="Up">↑</button>
            <button data-act="down" title="Down">↓</button>
            <button data-act="clone" title="Duplicate">⧉</button>
            <button data-act="delete" title="Delete">×</button>
          </div>
          ${blockPreview(b)}
        </div>`;
      }).join("");
      return `<div class="row-column" data-drop-row="${row.id}" data-drop-col="${ci}" style="width:${col.width}%;background:${row.contentBg};">${blocks||`<div class="empty-column">Drag content here</div>`}</div>`;
    }).join("");
    return `<div class="row-wrap ${selectedRow?"selected":""}" data-rowwrap="${row.id}" style="background:${row.bg};padding:${row.padding}px;">
      <div class="row-toolbar">
        <button data-rowact="select" title="Row settings">⚙</button>
        <button data-rowact="up" title="Move row up">↑</button>
        <button data-rowact="down" title="Move row down">↓</button>
        <button data-rowact="clone" title="Duplicate row">⧉</button>
        <button data-rowact="delete" title="Delete row">×</button>
      </div>
      <div class="row-columns">${cols}</div>
    </div>`;
  }).join("");

  root.querySelectorAll(".content-block").forEach(el=>{
    el.addEventListener("click",e=>{
      const act=e.target.closest("[data-act]");
      if(act){e.stopPropagation();contentAction(el.dataset.block,act.dataset.act);return}
      e.stopPropagation();
      const loc=locateBlock(el.dataset.block);
      selected={type:"block",rowId:loc.rowId,colIndex:loc.colIndex,blockId:el.dataset.block};
      renderCanvas();renderPanel();
    });
    el.addEventListener("dragstart",e=>{
      e.dataTransfer.setData("application/x-mgs-existing",el.dataset.block);
      e.dataTransfer.effectAllowed="move";
    });
  });
  root.querySelectorAll(".row-wrap").forEach(el=>{
    el.addEventListener("click",e=>{
      const btn=e.target.closest("[data-rowact]");
      if(btn){e.stopPropagation();rowAction(el.dataset.rowwrap,btn.dataset.rowact);return}
    });
  });
  root.querySelectorAll(".row-column").forEach(col=>{
    col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("dragover")});
    col.addEventListener("dragleave",()=>col.classList.remove("dragover"));
    col.addEventListener("drop",e=>{
      e.preventDefault();col.classList.remove("dragover");
      const rowId=col.dataset.dropRow, ci=+col.dataset.dropCol;
      const newType=e.dataTransfer.getData("application/x-mgs-new");
      const existing=e.dataTransfer.getData("application/x-mgs-existing");
      if(newType){addContent(newType,rowId,ci);return}
      if(existing){
        const loc=locateBlock(existing); if(!loc)return;
        const block=getRow(loc.rowId).columns[loc.colIndex].blocks.splice(loc.blockIndex,1)[0];
        getRow(rowId).columns[ci].blocks.push(block);
        selected={type:"block",rowId,colIndex:ci,blockId:block.id};
        snapshot();scheduleSave();renderAll();
      }
    });
  });
}
function contentAction(blockId,act){
  const loc=locateBlock(blockId); if(!loc)return;
  const arr=getRow(loc.rowId).columns[loc.colIndex].blocks;
  if(act==="up"&&loc.blockIndex>0)[arr[loc.blockIndex-1],arr[loc.blockIndex]]=[arr[loc.blockIndex],arr[loc.blockIndex-1]];
  if(act==="down"&&loc.blockIndex<arr.length-1)[arr[loc.blockIndex+1],arr[loc.blockIndex]]=[arr[loc.blockIndex],arr[loc.blockIndex+1]];
  if(act==="clone"){const copy=deep(arr[loc.blockIndex]);copy.id=uid();arr.splice(loc.blockIndex+1,0,copy);selected={type:"block",rowId:loc.rowId,colIndex:loc.colIndex,blockId:copy.id}}
  if(act==="delete"){arr.splice(loc.blockIndex,1);selected={type:null,rowId:null,colIndex:null,blockId:null}}
  snapshot();scheduleSave();renderAll();
}
function rowAction(rowId,act){
  const i=state.rows.findIndex(r=>r.id===rowId);if(i<0)return;
  if(act==="select"){selected={type:"row",rowId};renderAll();return}
  if(act==="up"&&i>0)[state.rows[i-1],state.rows[i]]=[state.rows[i],state.rows[i-1]];
  if(act==="down"&&i<state.rows.length-1)[state.rows[i+1],state.rows[i]]=[state.rows[i],state.rows[i+1]];
  if(act==="clone"){const cp=deep(state.rows[i]);cp.id=uid();cp.columns.forEach(c=>c.blocks.forEach(b=>b.id=uid()));state.rows.splice(i+1,0,cp);selected={type:"row",rowId:cp.id}}
  if(act==="delete"){state.rows.splice(i,1);selected={type:null,rowId:null,colIndex:null,blockId:null}}
  snapshot();scheduleSave();renderAll();
}

          <b style="color:#343b49">Body/UI:</b> Fira Sans 400–700<br>
          <b style="color:#343b49">Gmail fallback:</b> Arial / Helvetica
        </div>
      </div>
      <div class="settings-card"><h4>Project</h4>
      <button class="top-btn" style="width:100%;margin-bottom:8px" onclick="exportProject()">Export project JSON</button>
      <button class="top-btn" style="width:100%" onclick="document.getElementById('importJson').click()">Import project JSON</button></div>
      <button class="top-btn" style="width:100%;color:#c14848" onclick="resetProject()">Reset design</button>
    </div>`;

  const syncColor=(colorId,hexId,key)=>{
    const color=document.getElementById(colorId),hex=document.getElementById(hexId);
    color.oninput=e=>{const v=e.target.value;hex.value=v;state.settings[key]=v;scheduleSave();renderCanvas()};
    hex.onchange=e=>{const v=normalizeHex(e.target.value,state.settings[key]);hex.value=v;color.value=v;state.settings[key]=v;snapshot();scheduleSave();renderCanvas()};
  };
  document.getElementById("setWidth").oninput=e=>{
    state.settings.contentWidth=+e.target.value;
    document.querySelector("#setWidth").previousElementSibling.querySelector("small").textContent=e.target.value+"px";
    if(!document.getElementById("stageCanvas").classList.contains("mobile"))document.getElementById("stageCanvas").style.width=e.target.value+"px";
    scheduleSave()
  };
  syncColor("setBodyBg","setBodyBgHex","bodyBg");
  syncColor("setContentBg","setContentBgHex","contentBg");
  syncColor("setText","setTextHex","textColor");
  syncColor("setLink","setLinkHex","linkColor");

  document.getElementById("settingsBrandMode").onclick=()=>setRenderMode("brand");
  document.getElementById("settingsSafeMode").onclick=()=>setRenderMode("safe");
  bindPaletteCopy(p);
  bindPaletteApply(p);

  let settingPaletteTarget="setBodyBg";
  p.querySelectorAll("[data-setting-palette]").forEach(btn=>btn.onclick=()=>{
    settingPaletteTarget=btn.dataset.settingPalette;
    p.querySelectorAll("[data-setting-palette]").forEach(x=>x.classList.toggle("active",x===btn));
    document.getElementById("settingsQuickPalette").innerHTML=quickPalette(settingPaletteTarget);
    bindPaletteApply(p);
  });
}

function panelHeader(name){
  return `<div class="panel-title"><button class="back-btn" id="propBack">←</button><h3>${esc(name)}</h3><span style="width:28px"></span></div>`;
}
function alignField(b){
  return `<div class="field"><label>Align</label><div class="align-buttons">
  <button data-align="left" class="${b.align==="left"?"active":""}">≡</button>
  <button data-align="center" class="${b.align==="center"?"active":""}">≡</button>
  <button data-align="right" class="${b.align==="right"?"active":""}">≡</button></div></div>`;
}
function commonBlockBindings(b){
  document.querySelectorAll("[data-align]").forEach(btn=>btn.onclick=()=>mutate(()=>b.align=btn.dataset.align));
  document.getElementById("propBack").onclick=()=>{selected={type:null,rowId:null,colIndex:null,blockId:null};renderCanvas();renderPanel()};
}
function renderBlockProps(){
  const b=getBlock(); if(!b){selected.type=null;renderPanel();return}
  const p=document.getElementById("panel");
  let body="";
  if(b.type==="title"){
    body=`<div class="field"><label>Text</label><textarea id="pText">${esc(b.text)}</textarea></div>
    <div class="field"><label>Accent word</label><input id="pAccent" type="text" value="${attr(b.accent||"")}"></div>
    <div class="field"><label>Accent style</label><select id="pAccentMode">
      <option value="gradient" ${(b.accentMode||"solid")==="gradient"?"selected":""}>MGS Hero Gradient</option>
      <option value="solid" ${(b.accentMode||"solid")==="solid"?"selected":""}>Solid color</option>
    </select></div>
    ${(b.accentMode||"solid")==="gradient"
      ? `<div class="gradient-swatch"></div><div style="font-size:10px;color:#8a95a7;margin:6px 0 14px">#73D7FF → #A985EE → #ED75BD → #FFDA69</div>`
      : `<div class="inline-fields"><div class="field"><label>Text color</label><input id="pColor" type="color" value="${b.color}"></div><div class="field"><label>Accent color</label><input id="pAccentColor" type="color" value="${b.accentColor}"></div></div>
         <div class="palette-full-title">Text palette</div>${quickPalette("pColor")}
         <div class="palette-full-title">Accent palette</div>${quickPalette("pAccentColor",{hero:true})}`}
    ${(b.accentMode||"solid")==="gradient"?`<div class="field"><label>Text color</label><input id="pColor" type="color" value="${b.color}"></div>
      <div class="palette-full-title">Text palette</div>${quickPalette("pColor")}`:""}
    <div class="field"><label>Font size <small>${b.size}px</small></label><input id="pSize" type="range" min="18" max="72" value="${b.size}"></div>${alignField(b)}
    <div class="notice" style="margin-bottom:14px">${isBrandMode()?"Unbounded 600 в preview.":"Arial 700 — Gmail Safe preview."}</div>
    <div class="field"><label>Padding <small>${b.padding}px</small></label><input id="pPadding" type="range" min="0" max="50" value="${b.padding}"></div>`;
  } else if(b.type==="paragraph"||b.type==="eyebrow"){
    body=`<div class="field"><label>Text</label><textarea id="pText">${esc(b.text)}</textarea></div>
    <div class="inline-fields"><div class="field"><label>Color</label><input id="pColor" type="color" value="${b.color}"></div><div class="field"><label>Font size</label><input id="pSizeNum" type="number" min="8" max="40" value="${b.size}"></div></div>
    ${quickPalette("pColor")}${alignField(b)}
    <div class="field"><label>Padding <small>${b.padding}px</small></label><input id="pPadding" type="range" min="0" max="50" value="${b.padding}"></div>`;
  } else if(b.type==="image"){
    body=`<div class="field"><label>Image URL</label><input id="pUrl" type="url" value="${attr(b.url)}" placeholder="https://..."></div>
    <label class="upload">Upload image<input id="pUpload" type="file" accept="image/*"></label><div style="height:14px"></div>
    <div class="field"><label>Alt text</label><input id="pAlt" type="text" value="${attr(b.alt)}"></div>
    <div class="field"><label>Image link</label><input id="pLink" type="url" value="${attr(b.link||"")}"></div>
    <div class="field"><label>Width <small>${b.width}%</small></label><input id="pWidth" type="range" min="10" max="100" value="${b.width}"></div>
    <div class="field"><label>Rounded corners <small>${b.radius}px</small></label><input id="pRadius" type="range" min="0" max="40" value="${b.radius}"></div>${alignField(b)}
    <div class="notice">Для отправки получателю надёжнее использовать публичный HTTPS URL изображения.</div>`;
  } else if(b.type==="logo"){
    body=`<div class="field"><label>Logo URL</label><input id="pUrl" type="url" value="${attr(b.url)}"></div>
    <div class="field"><label>Link</label><input id="pLink" type="url" value="${attr(b.link||"")}"></div>
    <div class="field"><label>Width <small>${b.width}px</small></label><input id="pWidthPx" type="range" min="50" max="300" value="${b.width}"></div>${alignField(b)}
    <div class="field"><label>Padding <small>${b.padding}px</small></label><input id="pPadding" type="range" min="0" max="50" value="${b.padding}"></div>`;
  } else if(b.type==="button"){
    body=`<div class="field"><label>Button text</label><input id="pTextInput" type="text" value="${attr(b.text)}"></div>
    <div class="field"><label>Link</label><input id="pUrl" type="url" value="${attr(b.url)}"></div>
    <div class="inline-fields"><div class="field"><label>Background</label><input id="pBg" type="color" value="${b.bg}"></div><div class="field"><label>Text</label><input id="pColor" type="color" value="${b.color}"></div></div>
    <div class="palette-full-title">Button background</div>${quickPalette("pBg")}
    <div class="palette-full-title">Button text</div>${quickPalette("pColor")}
    <div class="field"><label>Rounded corners <small>${b.radius}px</small></label><input id="pRadius" type="range" min="0" max="999" value="${b.radius}"></div>${alignField(b)}
    <div class="field"><label>Padding <small>${b.padding}px</small></label><input id="pPadding" type="range" min="0" max="50" value="${b.padding}"></div>`;
  } else if(b.type==="divider"){
    body=`<div class="inline-fields"><div class="field"><label>Color</label><input id="pColor" type="color" value="${b.color}"></div><div class="field"><label>Thickness</label><input id="pThickness" type="number" min="1" max="10" value="${b.thickness}"></div></div>
    ${quickPalette("pColor")}
    <div class="field"><label>Padding <small>${b.padding}px</small></label><input id="pPadding" type="range" min="0" max="50" value="${b.padding}"></div>`;
  } else if(b.type==="spacer"){
    body=`<div class="field"><label>Height <small>${b.height}px</small></label><input id="pHeight" type="range" min="4" max="150" value="${b.height}"></div>`;
  }
  p.innerHTML=panelHeader(({title:"Title",paragraph:"Paragraph",image:"Image",button:"Button",divider:"Divider",spacer:"Spacer",logo:"Logo",eyebrow:"Label"})[b.type]+" properties")+body;
  commonBlockBindings(b);

  const bind=(id,key,ev="input",convert=v=>v)=>{const el=document.getElementById(id);if(el)el.addEventListener(ev,e=>mutate(()=>b[key]=convert(e.target.value),false))};
  bind("pText","text");bind("pTextInput","text");bind("pAccent","accent");bind("pColor","color");bind("pAccentColor","accentColor");
  bind("pAccentMode","accentMode","change");
  bind("pSize","size","input",Number);bind("pSizeNum","size","input",Number);bind("pPadding","padding","input",Number);
  bind("pUrl","url");bind("pAlt","alt");bind("pLink","link");bind("pWidth","width","input",Number);bind("pWidthPx","width","input",Number);
  bind("pRadius","radius","input",Number);bind("pBg","bg");bind("pThickness","thickness","input",Number);bind("pHeight","height","input",Number);
  const up=document.getElementById("pUpload");if(up)up.onchange=e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>mutate(()=>b.url=r.result);r.readAsDataURL(f)
  };
  bindPaletteApply(p);
}
function renderRowProps(){
  const row=getRow(selected.rowId);if(!row){selected.type=null;renderPanel();return}
  const p=document.getElementById("panel");
  p.innerHTML=panelHeader("Row properties")+`
  <div class="inline-fields">
    <div class="field"><label>Row background</label><input id="rBg" type="color" value="${row.bg}"></div>
    <div class="field"><label>Content background</label><input id="rContentBg" type="color" value="${row.contentBg}"></div>
  </div>
  <div class="palette-full-title">Row background palette</div>${quickPalette("rBg")}
  <div class="palette-full-title">Content background palette</div>${quickPalette("rContentBg")}
  <div class="field"><label>Outer padding <small>${row.padding}px</small></label><input id="rPadding" type="range" min="0" max="60" value="${row.padding}"></div>
  <div class="property-group"><div class="switch-row"><span>Stack on mobile</span><button id="rStack" class="switch ${row.stack?"on":""}"></button></div></div>
  <div class="property-group"><div class="section-label">Columns structure</div>
    ${row.columns.map((c,i)=>`<div class="field"><label>Column ${i+1} <small>${Math.round(c.width)}%</small></label><input data-colwidth="${i}" type="range" min="10" max="90" value="${c.width}"></div>`).join("")}
  </div>`;
  document.getElementById("propBack").onclick=()=>{selected={type:null,rowId:null,colIndex:null,blockId:null};renderCanvas();renderPanel()};
  document.getElementById("rBg").oninput=e=>mutate(()=>row.bg=e.target.value,false);
  document.getElementById("rContentBg").oninput=e=>mutate(()=>row.contentBg=e.target.value,false);
  document.getElementById("rPadding").oninput=e=>mutate(()=>row.padding=+e.target.value,false);
  document.getElementById("rStack").onclick=()=>mutate(()=>row.stack=!row.stack);
  bindPaletteApply(p);
  p.querySelectorAll("[data-colwidth]").forEach(input=>input.oninput=e=>{
    const idx=+e.target.dataset.colwidth, n=row.columns.length;
    if(n===1){row.columns[0].width=100;return}
    let val=+e.target.value;row.columns[idx].width=val;
    const other=(100-val)/(n-1);row.columns.forEach((c,j)=>{if(j!==idx)c.width=other});
    scheduleSave();renderCanvas();renderPanel();
  });
}

function setRenderMode(mode){
  state.settings.renderMode=mode==="safe"?"safe":"brand";
  snapshot();scheduleSave();renderAll();
  toast(isBrandMode()?"Brand Accurate mode":"Gmail Safe mode");
}

function renderAll(){
  document.getElementById("designName").value=state.designName;
  if(!document.getElementById("stageCanvas").classList.contains("mobile"))document.getElementById("stageCanvas").style.width=state.settings.contentWidth+"px";
  const brand=document.getElementById("brandModeBtn"),safe=document.getElementById("safeModeBtn");
  if(brand&&safe){brand.classList.toggle("active",isBrandMode());safe.classList.toggle("active",!isBrandMode())}
  renderCanvas();renderPanel();updateUndo();
}

function emailBlock(b){
  const pad=b.padding||0, hfont=emailHeadingFont(), bfont=emailBodyFont();
  if(b.type==="title"){
    let txt=esc(b.text);
    if(b.accent){
      const t=esc(b.accent);
      if((b.accentMode||"solid")==="gradient" && isBrandMode()){
        txt=txt.replace(t,`<span style="display:inline-block;color:#73d7ff;background:linear-gradient(100deg,#73d7ff 0%,#a985ee 32%,#ed75bd 61%,#ffda69 100%);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;">${t}</span>`);
      }else{
        txt=txt.replace(t,`<span style="color:${b.accentColor||"#00a0e3"};">${t}</span>`);
      }
    }
    return `<div style="padding:${pad}px;font-family:${hfont};font-size:${b.size}px;line-height:1.08;font-weight:${isBrandMode()?600:700};letter-spacing:${isBrandMode()?"-.018em":"-.025em"};color:${b.color};text-align:${b.align};">${txt}</div>`;
  }
  if(b.type==="paragraph")return `<div style="padding:${pad}px;font-family:${bfont};font-size:${b.size}px;line-height:1.56;font-weight:400;letter-spacing:0;color:${b.color};text-align:${b.align};">${nl2br(b.text)}</div>`;
  if(b.type==="eyebrow")return `<div style="padding:${pad}px;font-family:${bfont};font-size:${b.size}px;line-height:1.4;font-weight:600;letter-spacing:.085em;text-transform:uppercase;color:${b.color};text-align:${b.align};">${esc(b.text)}</div>`;
  if(b.type==="image"){
    const im=b.url?`<img src="${attr(b.url)}" width="600" alt="${attr(b.alt)}" style="display:inline-block;width:${b.width}%;max-width:${b.width}%;height:auto;border-radius:${b.radius}px;border:0;">`:"";
    return `<div style="padding:${pad}px;text-align:${b.align};">${b.link?`<a href="${attr(b.link)}" target="_blank">${im}</a>`:im}</div>`;
  }
  if(b.type==="logo"){
    const im=`<img src="${attr(b.url)}" width="${b.width}" alt="Madibaev Graphic Studio" style="display:inline-block;width:${b.width}px;max-width:100%;height:auto;border:0;">`;
    return `<div style="padding:${pad}px;text-align:${b.align};">${b.link?`<a href="${attr(b.link)}" target="_blank">${im}</a>`:im}</div>`;
  }
  if(b.type==="button")return `<div style="padding:${pad}px;text-align:${b.align};"><a href="${attr(b.url)}" target="_blank" style="display:inline-block;padding:14px 21px;border-radius:${b.radius}px;background:${b.bg};color:${b.color};font-family:${bfont};font-size:13px;line-height:17px;font-weight:700;text-decoration:none;">${esc(b.text)}</a></div>`;
  if(b.type==="divider")return `<div style="padding:${b.padding}px 0;"><div style="height:${b.thickness}px;line-height:${b.thickness}px;background:${b.color};font-size:0;">&nbsp;</div></div>`;
  if(b.type==="spacer")return `<div style="height:${b.height}px;line-height:${b.height}px;font-size:1px;">&nbsp;</div>`;
  return "";
}

function generateEmail(){
  const s=state.settings;
  const rows=state.rows.map(row=>{
    const tds=row.columns.map((col,ci)=>`<td class="mgs-col" width="${Math.round(col.width)}%" valign="top" style="width:${col.width}%;background:${row.contentBg};">${col.blocks.map(emailBlock).join("")}</td>`).join("");
    return `<tr><td style="padding:${row.padding}px;background:${row.bg};"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>${tds}</tr></table></td></tr>`;
  }).join("");

  const webFonts=isBrandMode()
    ? `<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">`
    : "";

  return `<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="x-apple-disable-message-reformatting"><title>${esc(state.designName)}</title>${webFonts}
<style>
body,table,td,a{-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}
table,td{mso-table-lspace:0pt;mso-table-rspace:0pt}
table{border-collapse:collapse!important}
img{border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic}
body{margin:0!important;padding:0!important;width:100%!important;background:${s.bodyBg}}
@media screen and (max-width:680px){.mgs-container{width:100%!important}.mgs-col{display:block!important;width:100%!important;max-width:100%!important}}
</style></head><body style="margin:0;padding:0;background:${s.bodyBg};"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background:${s.bodyBg};"><tr><td align="center" style="padding:24px 10px;"><table role="presentation" class="mgs-container" width="${s.contentWidth}" cellpadding="0" cellspacing="0" border="0" style="width:${s.contentWidth}px;max-width:${s.contentWidth}px;background:${s.contentBg};">${rows}</table></td></tr></table></body></html>`;
}

function toast(msg){
  const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500)
}
async function copyGmail(){
  const html=generateEmail();
  try{
    if(window.ClipboardItem&&navigator.clipboard?.write){
      await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([state.designName],{type:"text/plain"})})]);
      toast("Copied for Gmail");return;
    }
  }catch(e){}
  const w=window.open();w.document.open();w.document.write(html);w.document.close();
  alert("В открывшемся preview нажмите Ctrl+A → Ctrl+C и вставьте в Gmail.");
}
function download(name,content,type){
  const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)
}
function exportProject(){download("mgs-email-project.json",JSON.stringify(state,null,2),"application/json;charset=utf-8")}
function resetProject(){if(confirm("Вернуть исходный шаблон Madibaev Studio?")){state=deep(defaults);history=[JSON.stringify(state)];historyIndex=0;selected={type:null};scheduleSave();renderAll()}}

document.querySelectorAll("#tabs button").forEach(btn=>btn.onclick=()=>{
  activeTab=btn.dataset.tab;selected={type:null,rowId:null,colIndex:null,blockId:null};renderCanvas();renderPanel()
});
document.getElementById("designName").oninput=e=>{state.designName=e.target.value;scheduleSave()};
document.getElementById("designName").onchange=()=>snapshot();
document.getElementById("undoBtn").onclick=undo;
document.getElementById("redoBtn").onclick=redo;
document.getElementById("desktopBtn").onclick=()=>{
  document.getElementById("stageCanvas").classList.remove("mobile");
  document.getElementById("stageCanvas").style.width=state.settings.contentWidth+"px";
  desktopBtn.classList.add("active");mobileBtn.classList.remove("active")
};
document.getElementById("mobileBtn").onclick=()=>{
  document.getElementById("stageCanvas").classList.add("mobile");
  document.getElementById("stageCanvas").style.width="375px";
  mobileBtn.classList.add("active");desktopBtn.classList.remove("active")
};
document.getElementById("brandModeBtn").onclick=()=>setRenderMode("brand");
document.getElementById("safeModeBtn").onclick=()=>setRenderMode("safe");
document.getElementById("previewBtn").onclick=()=>{const w=window.open();w.document.open();w.document.write(generateEmail());w.document.close()};
document.getElementById("exportBtn").onclick=e=>{e.stopPropagation();document.getElementById("exportMenu").classList.toggle("show")};
document.addEventListener("click",()=>document.getElementById("exportMenu").classList.remove("show"));
document.getElementById("exportMenu").onclick=e=>e.stopPropagation();
document.getElementById("copyGmail").onclick=copyGmail;
document.getElementById("downloadHtml").onclick=()=>download("madibaev-studio-email.html",generateEmail(),"text/html;charset=utf-8");
document.getElementById("copyCode").onclick=async()=>{try{await navigator.clipboard.writeText(generateEmail());toast("HTML code copied")}catch(e){alert("Не удалось скопировать код.")}};
document.getElementById("exportJson").onclick=exportProject;
document.getElementById("importJsonBtn").onclick=()=>document.getElementById("importJson").click();
document.getElementById("importJson").onchange=e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{state=JSON.parse(r.result);history=[JSON.stringify(state)];historyIndex=0;selected={type:null};scheduleSave();renderAll();toast("Project imported")}catch(err){alert("Некорректный JSON")}};r.readAsText(f)
};

renderAll();
</script>
</body>
